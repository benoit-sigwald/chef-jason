# Déploiement Render — Web Service Node (serveur Express).
services:
  - type: web
    name: le-chef-jason
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Clé OpenRouter (LLM open-source) — saisie dans le dashboard Render.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
